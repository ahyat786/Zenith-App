name: Build APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Rust core + Gradle APK (Built with 🩷 Pistis Litae)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner GitHub sudah menyertakan Android SDK di ANDROID_HOME —
      # cukup terima lisensi & pasang komponen yang dipin proyek.
      - name: Siapkan komponen Android SDK (NDK 27.1 + platform 37)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;27.1.12297006" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          "$SDKMANAGER" --list_installed 2>/dev/null | grep -E "ndk;|platforms;android-37|build-tools;37" | head -5

      - name: Setup Rust (4 target Android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Tambah cargo ke PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry & build Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: zenith-cargo-${{ runner.os }}-${{ hashFiles('rust/zenith-core/Cargo.toml', 'rust/zenith-core/Cargo.lock') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Uji inti Rust (cargo test)
        run: cd rust && cargo test

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      # Uji perilaku fitur per rilis (keep-alive WebView, palet Material You,
      # Snackbar, histori tab, shields, aksesibilitas) — modul murni
      # dikompilasi lalu dijalankan, ditambah pemeriksaan wiring.
      # Tanpa dependensi tambahan: cukup `node`.
      - name: Periksa fitur rilis (eval/check-v*.js)
        run: |
          status=0
          for f in eval/check-v*.js; do
            echo "::group::$f"
            node "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

      # Kunci rilis tersimpan di GitHub Secrets (terenkripsi, write-only).
      # Di-decode ke file sementara lalu dilewatkan ke Gradle via env.
      - name: Siapkan keystore rilis dari GitHub Secrets
        env:
          ZENITH_KEYSTORE_BASE64: ${{ secrets.ZENITH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ZENITH_KEYSTORE_BASE64" ]; then
            printf '%s' "$ZENITH_KEYSTORE_BASE64" | base64 -d > "$HOME/zenith-release.keystore"
            echo "ZENITH_KEYSTORE_FILE=$HOME/zenith-release.keystore" >> "$GITHUB_ENV"
            echo "keystore rilis siap ✓"
          else
            echo "secret keystore tidak tersedia — build akan memakai debug key"
          fi

      - name: Build APK release (Rust .so + Hermes bundle + Gradle)
        env:
          ZENITH_KEYSTORE_PASSWORD: ${{ secrets.ZENITH_KEYSTORE_PASSWORD }}
          ZENITH_KEYSTORE_ALIAS: ${{ secrets.ZENITH_KEYSTORE_ALIAS }}
          ZENITH_KEY_PASSWORD: ${{ secrets.ZENITH_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --stacktrace

      - name: Verifikasi tanda tangan APK
        run: |
          cd android/app/build/outputs/apk/release
          APK=$(ls *.apk | head -1)
          APKSIGNER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | head -6

      - name: Ganti nama APK
        run: |
          cd android/app/build/outputs/apk/release
          if [ -f app-release.apk ]; then
            mv app-release.apk "Zenith-${GITHUB_REF_NAME}-android.apk"
          fi
          # Nama stabil untuk tombol unduh di README. Jangan diubah:
          # https://github.com/ahyat786/Zenith-App/releases/latest/download/Zenith-android.apk
          SRC=$(ls -1 Zenith-*.apk | grep -v '^Zenith-android\.apk$' | head -1)
          if [ -n "$SRC" ]; then
            cp "$SRC" Zenith-android.apk
          fi
          ls -lh

      - name: Upload artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: Zenith-APK
          path: android/app/build/outputs/apk/release/Zenith-*.apk
          retention-days: 30

      - name: Buat GitHub Release (jika tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/Zenith-*.apk
          generate_release_notes: true
          body: |
            🅧 **Zenith Browser** — Rust + React Native
            *Zen UX + skrip Via + ekstensi Kiwi*

            **Built with 🩷 Pistis Litae**

            Ditandatangani kunci rilis (GitHub Secrets) · Kompatibel: Android 7.0 (API 24) → Android 16/17 · 4 ABI (arm64-v8a, armeabi-v7a, x86, x86_64)

            Unduh langsung rilis ini: `Zenith-android.apk` (nama stabil) dan `Zenith-${{ github.ref_name }}-android.apk`.
