[package]
name = "zenith-core"
version = "0.1.0"
edition = "2021"
description = "Zenith Browser core engine: userscript parsing (Via-compatible), Chrome extension manifest parsing (Kiwi-compatible subset), ad-blocker, and URL utilities."
license = "MIT"

[lib]
name = "zenith_core"
# cdylib -> libzenith_core.so untuk Android (JNI), rlib -> unit test di host
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
regex = "1"
once_cell = "1"
